<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <title>Landing Page</title>
  </head>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Times';
      
    }

    navbar{
      background:transparent;
      width:100%;
      position:fixed;
      padding:10px 0; 
      z-index:12;
      
    }

    navbar .menu{
        width:90%;
        margin:20px auto 20px auto;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding: 0 20px; 
    }


  .menu .logo a{
        text-decoration:none;
        color:#fff;
        font-size:60px;
        font-weight:600;
        background:none;
  }



    .menu ul{
      display:inline-flex;
      
    }
    .menu ul li{
      list-style:none;
      margin-left:7px;
      
    }
    .menu ul li a{
      text-decoration:none;
      color:#fff;
      font-size:18px;
      font-weight:500;
      background: transparent;
      padding:8px 15px;
      border-radius:5px;
      transition: all 0.3s ease;
    }

    .menu ul li a:hover{
      background:#fff;
      color:#000;
    }


        .menu ul li button{
          height:40px;
          width:200px;
      border-radius:5px;
      border:none;
      border: 2px solid #000;
      font-size:20px;
      font-weight:500;
      padding:0 10px;
      cursor:pointer;
      outline:none;
      transition:all 0.3s ease;
      background:#000;
        }
    .menu ul li button:hover{
        background:#fff;
      color:#000;
    }
    header{
      background:url(img2.jpg) no-repeat;
      height:100vh;
      width:100%;
      background-position:center;
      background-size:cover;
      postion:relative;
      z-index:2000;
    }

    .content::before{
      content:"";
      position:absolute;
      height:100%;
      width:100%;
      background:rgba(0, 0, 0, 0.2);
      
    }


    
    .text-content{
      position:absolute;
      top:43%;
      left:0;
      width:100%;
      transform:translateY(-50%, -50%);
      padding:0 20px;
      text-align:left;
      
    }

      .content .text{
        color:#fff;
        font-size:27px;
        line-height:56px;
        
      }

    .content .name{
      font-size:75px;
      font-weight:600;
      margin: -20px 0 0 -3px;
      
    }

    .content .job{
      font-size:40px;
      color:#2c3e50;
      display:flex;
    }
    .content .job .typing-text{
      color:#1de2d1;
      margin-left:10px;
      white-space:nowrap;
      overflow:hidden;
      border-right:4px solid #1de2d1;
      animation:typing 5s steps(21) infinite;
    }

    @keyframes typing{
      0%{
        width:0ch;
    }
    50%{
      width:21ch;
      
    }
      100%{
        width:0ch;
      }
    }
    .content .buttons{
      margin-top:20px;
    }

    .content .buttons button{
      height:55px;
      width:170px;
      border-radius:5px;
      border:none;
      margin:0 10px;
      font-size:20px;
      font-weight:500;
      padding:0 10px;
      cursor:pointer;
      outline:none;
      transition:all 0.3s ease;
    }

      .content .buttons button:hover{
        transform: scale(1.3);
        box-shadow: 0 0 20px #000;
      }

    .content .buttons button:first-child{
        color:#fff;
        background:lightgreen;;
    }

    .content .buttons button a{
      text-decoration:none;
      color:#fff;
    }

    
    .content .text{
      font-size:27px;
      color:#2c3e50;
    }

    header .me img{
      height:95%;
      position:absolute;
      right:0;
      bottom:0;
    }

      .socials{
        padding:20px;
        height:20px;
        width
      }
  </style>
  <body>
    <header>
      <navbar>
      <div class="menu">
        <div class="logo">
          <a href="#">Owen Breezy</a>
          </div>
        
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
        <li><button><a href="#">Message Me</a></button></li>

      </ul>
        </div>

    </navbar>
    <div class="content">
    <div class="text-content">
      <div class="text">Hello, It's Me</div>
      <div class="name"><font style="color:blue">Owami Mzelemu </font><br/> </div>
      <div class="job">
         <span>And I'm a</span>
        <div class="typing-text">
          <span>Junior Web Developer.</span>
        </div>
      </div>
      <div class="buttons">
        <button><a href="#">Learn More</a></button>
    </div>
      <div class="me">
        <img src="me.png" alt="">
      </div>
      
      

  </body>

</html>
